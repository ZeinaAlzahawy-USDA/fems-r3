<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Southwest Fire Danger</title>
<meta name="description" content="Fire danger by FDRA for Arizona and New Mexico, from FEMS data.">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
/* =====================================================================
   SETTINGS — the only part you normally edit
   ===================================================================== */
.source a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.source a:hover{text-decoration-thickness:2px}
</style>
<script>
window.APP_CONFIG = {
  // NIFC ArcGIS Online org (editor sign-in goes here)
  portalUrl: "https://nifc.maps.arcgis.com",
  // OAuth Client ID from the ArcGIS app item (leave "" until created — sign-in stays hidden)
  oauthClientId: "",
  // Group whose members may edit ratings (group item id). "" = any signed-in user who can edit the table.
  editorsGroupId: "",
  // Hosted TABLE that stores the official ratings (…/FeatureServer/0). "" = calculated ratings only.
  ratingsTableUrl: "",
  ratingsFields: { key: "FDRA_ZONE", rating: "Rating", note: "Note" },
  // Optional FDRA polygon layer (…/FeatureServer/0) and the field holding values like "FDZ Mogollon Rim"
  //  Either an ArcGIS layer (…/FeatureServer/0, shared with Everyone) or a GeoJSON file in the site folder (e.g. "fdra.geojson").
  //  Default: a file named fdra.geojson placed in the site folder. If it is not there, the map just shows stations.
  fdraLayerUrl: "fdra.geojson",
  zonesUrl: "zones.geojson",          // SWCC dispatch zone boundaries (from the National Dispatch Boundaries layer)
  //  "auto" finds the FDRA name field (FDRA_ZONE, or Zone + FDRA). Or list fields, e.g. ["Zone", "FDRA"].
  fdraKeyFields: "auto",
  // State outlines are built into this page (no login needed). States drawn bold:
  focusStates: ["Arizona", "New Mexico"],
  // Zone names shown on the tabs (code → label). Add the full names when you have them.
  zoneNames: { ABZ: "ABZ", FDZ: "FDZ", GLZ: "GLZ", PIFC: "PIFC", TDZ: "TDZ", WAZ: "WAZ", WDZ: "WDZ" },
  dataUrl: "data/meta.json"
};
</script>
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f8f7f4; --line:#dcd9d2; --line-strong:#9b978e;
  --ink:#1b1a17; --ink-2:#55524b; --ink-3:#7d796f; --accent:#7a2e12; --accent-ink:#ffffff;
  --tab:#ebe8e1; --focus:#2a78d6; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --cls-ink:#1b1a17;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1d1c1a; --surface-2:#242320; --line:#36342f; --line-strong:#6b675e;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#98958b; --accent:#e0794e; --accent-ink:#1b1a17;
    --tab:#2a2925; --focus:#3987e5; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1d1c1a; --surface-2:#242320; --line:#36342f; --line-strong:#6b675e;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#98958b; --accent:#e0794e; --accent-ink:#1b1a17;
  --tab:#2a2925; --focus:#3987e5; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{flex:none;display:block;height:60px;width:59px}
.brand .logo img{height:60px;width:auto;display:block}
.brand .logo .logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo .logo-light{display:none}:root:not([data-theme="light"]) .brand .logo .logo-dark{display:block}}
:root[data-theme="dark"] .brand .logo .logo-light{display:none}
:root[data-theme="dark"] .brand .logo .logo-dark{display:block}
.brand h1{font-size:21px}
@media (max-width:700px){.brand .logo,.brand .logo img{height:46px;width:auto}}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;margin:0;letter-spacing:.1px}
.brand .sub{font-size:12.5px;color:var(--ink-3)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.user-chip{font-size:13px;color:var(--ink-2)}

/* zone tabs */
nav.zones{background:var(--surface);border-bottom:1px solid var(--line)}
.appbar{position:sticky;top:0;z-index:50;background:var(--surface);transition:box-shadow .2s}
.appbar.scrolled{box-shadow:0 4px 18px rgba(0,0,0,.10)}
.top .wrap,.brand .logo,.brand .logo img,.brand h1{transition:all .2s ease}
.appbar.scrolled .top .wrap{padding-top:6px;padding-bottom:6px}
.appbar.scrolled .brand .logo,.appbar.scrolled .brand .logo img{height:38px;width:auto}
.appbar.scrolled .brand h1{font-size:16px}
.appbar.scrolled .brand .sub{display:none}
.zones .wrap{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;padding-top:8px}
.zones .wrap::-webkit-scrollbar{display:none}
.ztab{flex:none;border:1px solid var(--line);border-bottom:none;background:var(--tab);padding:8px 16px;border-radius:7px 7px 0 0;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.ztab .count{font-weight:500;font-size:12px;color:var(--ink-3)}
.ztab[aria-selected="true"]{background:var(--bg);color:var(--ink);border-color:var(--line-strong);position:relative;top:1px}
.ztab .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* FDRA chips */
.fdra-bar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 10px;align-items:center}
.fdra-bar .lbl{font-size:12.5px;color:var(--ink-3);margin-right:4px;text-transform:uppercase;letter-spacing:.6px}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* map */
.map-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
#map{height:clamp(440px,74vh,910px);width:100%}
.map-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.map-tools .btn{box-shadow:var(--shadow)}
.map-legend{position:absolute;right:12px;bottom:12px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:12px;z-index:5;box-shadow:0 6px 24px rgba(20,20,20,.12);max-width:calc(100% - 24px)}
.map-legend .lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 14px;background:none;border:0;font:inherit;font-weight:650;font-size:13px;color:var(--ink);cursor:pointer}
.map-legend .lg-head .chev{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--ink-3);font-size:9px;transition:transform .15s}
.map-legend.closed .lg-head .chev{transform:rotate(180deg)}
.map-legend.closed .lg-body{display:none}
.map-legend .lg-body{padding:0 14px 12px}
.map-legend .lg-sec{padding:10px 0;border-top:1px solid var(--line)}
.map-legend h5{margin:0;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.map-legend .sub{font-size:10.5px;color:var(--ink-3);margin:1px 0 7px}
.map-legend .ramp{display:flex;height:10px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.map-legend .ramp span{flex:1}
.map-legend .ramp span + span{border-left:1.5px solid var(--surface)}
.map-legend .lbls{display:flex;margin-top:4px;font-size:10.5px;color:var(--ink-2)}
.map-legend .lbls span{flex:1;text-align:center;white-space:nowrap}
.map-legend .ticks{position:relative;height:14px;margin-top:3px;font-size:10.5px;color:var(--ink-2)}
.map-legend .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.map-legend .ticks span:first-child{transform:none}.map-legend .ticks span:last-child{transform:translateX(-100%)}
.map-legend .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.map-legend .it{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--ink)}
.map-legend .si{width:16px;height:16px;display:block;flex:none}
.map-legend .ln{width:18px;height:0;border-top:3px solid #1e3a8a;border-radius:2px}
.map-legend .dsh{width:14px;height:12px;border:1.5px dashed #6e6a62;border-radius:2px}
.map-legend .row + .row{margin-top:6px}
.map-legend .bx{width:26px;height:16px;border-radius:4px;background:#eceae4;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.map-legend .bx i{display:block;width:18px;height:0;border-top-style:solid;border-radius:2px}
@media (max-width:700px){ .map-legend{width:270px} }
.map-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--ink-2);background:var(--surface-2)}
.map-msg.show{display:grid}

/* intro line */
.source{font-size:13px;color:var(--ink-2);text-align:center;padding:16px 8px 4px;border-top:2px solid var(--line-strong);margin-top:18px}
.source strong{color:var(--ink)}

/* FDRA report sections */
section.fdra{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:14px 0;box-shadow:var(--shadow)}
section.fdra.focus{border-color:var(--ink)}
.fdra-head{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;cursor:pointer;flex-wrap:wrap}
.fdra-head h2{font-size:19px;margin:0;display:flex;gap:8px;align-items:center}
.fdra-head .caret{display:inline-block;transition:transform .15s;font-size:13px;color:var(--ink-3)}
section.fdra:not(.open) .caret{transform:rotate(-90deg)}
.fdra-head .meta{font-size:13px;color:var(--ink-2);flex-basis:100%;padding-left:21px}
.fdra-head .meta button.st{border:none;background:none;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13px}
.rating-box{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:3px 10px;font-weight:700;color:var(--cls-ink);font-size:13.5px;border:1px solid rgba(0,0,0,.12)}
.badge small{font-weight:500;opacity:.8}
.fdra-body{display:none;padding:0 16px 16px}
section.fdra.open .fdra-body{display:block}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:4px 0 12px;font-size:13px}
.legend .lab{color:var(--ink-2);margin-right:4px}
.legend .cls{padding:3px 9px;border-radius:4px;color:var(--cls-ink);border:1px solid rgba(0,0,0,.1)}
.legend .cls b{font-weight:600}

.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table.rep{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:14px;font-variant-numeric:tabular-nums}
table.rep th,table.rep td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.rep thead th{background:var(--surface-2);font-size:12.5px;color:var(--ink-2);font-weight:700;letter-spacing:.3px}
table.rep thead tr.grp th{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:.5px}
table.rep .gsep{border-left:2px solid var(--line-strong)}
table.rep th.period{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;min-width:150px}
table.rep th.period b{display:block;font-size:14.5px;color:var(--ink)}
table.rep th.period span{font-size:12px;color:var(--ink-3);font-weight:500}
table.rep th.period em{font-style:normal;font-size:11px;color:var(--ink-3);display:block}
table.rep td.kind{color:var(--ink-3);font-size:12.5px;text-align:right}
table.rep td.pct{color:var(--cls-ink);font-size:13px}
table.rep td.fd{font-weight:700;color:var(--cls-ink);min-width:96px}
table.rep tr.block-start th, table.rep tr.block-start td{border-top:2px solid var(--line-strong)}
table.rep td.na{color:var(--ink-3)}
table.rep td.pct.pg{color:var(--ink-3)}
small.avgt{font-weight:500;font-size:11px;color:var(--ink-3);white-space:nowrap}
table.rep.daily th span{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
table.rep.daily th.rl{text-align:left;padding-left:12px;white-space:nowrap}
table.rep.daily td.fd{font-size:12.5px;min-width:0}

.under{margin-top:16px}
.bp h3{font-size:14px;margin:0 0 6px}
.under .bp{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
/* same grid as the season charts below, so Breakpoints lines up with ERC and Matrix with BI */
.under{display:grid;grid-template-columns:1fr;gap:18px;align-items:stretch}
@media (min-width:1150px){.under{grid-template-columns:1fr 1fr}.under .bp.rs{grid-column:1 / -1}}
.under table.bpt th,.under table.bpt td{padding:5px 8px}
@media (min-width:1150px) and (max-width:1399px){.under table.bpt th,.under table.bpt td{padding:4px 4px;font-size:12px;letter-spacing:-.1px}.under .bp{padding:12px 10px}}
.under table.bpt td,.under table.bpt th{white-space:nowrap}
.under .bp table.bpt{width:100%}
.under .bp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
table.bpt.mtx td.now{outline:3px solid var(--ink);outline-offset:-3px}
.nowkey{display:inline-block;width:12px;height:12px;border:3px solid var(--ink);border-radius:2px;vertical-align:-2px;margin-left:6px}
table.rst th{font-size:12.5px}
table.rst tbody th{text-align:left;color:var(--ink);font-weight:600;white-space:nowrap}

table.rst thead th span{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
table.rst td.rs-c{color:var(--cls-ink);border:2px solid var(--surface-2);padding:6px 10px}
table.rst td.rs-c .rs-n{display:block;font-weight:700;font-size:13.5px}
table.rst tr.rs-total td{padding:9px 10px;font-size:14px}

table.bpt{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.bpt th,table.bpt td{padding:4px 12px;text-align:center;border-bottom:1px solid var(--line)}
table.bpt th{color:var(--ink-2);font-size:12.5px}
table.bpt td{color:var(--cls-ink)}
table.bpt.mtx th{white-space:nowrap}
table.bpt.mtx tbody th{text-align:left;color:var(--ink-2);font-size:12.5px}
table.bpt.mtx td{min-width:64px;border:2px solid var(--surface)}
.footnote{font-size:12px;color:var(--ink-3);margin-top:8px}

/* station drawer */
.drawer{position:fixed;z-index:1000;right:16px;bottom:16px;width:min(470px,calc(100vw - 32px));max-height:min(80vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none}
.drawer.show{display:block}
.drawer header{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--surface)}
.drawer h3{margin:0;font-size:16px}
.drawer .dact{margin-left:auto;display:flex;gap:2px;align-items:center}
.drawer .dact .x{margin-left:0;width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.drawer .dact .x:hover{background:var(--surface-2)}
.drawer #dMin{font-size:18px}
.drawer.min{max-height:none;overflow:hidden}
.drawer.min .body{display:none}
.drawer.min header{border-bottom:none;cursor:pointer}
.drawer.min header:hover{background:var(--surface-2)}
.drawer .x{margin-left:auto;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2)}
.drawer .body{padding:12px 14px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.drawer h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin:14px 0 6px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:3px 5px;text-align:right;border-bottom:1px solid var(--line)}
.mini th:first-child,.mini td:first-child{text-align:left}
.fmsel{display:flex;gap:4px;margin-bottom:8px;align-items:center}
.fmsel .lbl{font-size:12px;color:var(--ink-3);margin-right:4px}
.dtabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0 10px;gap:2px}
.dtabs button{border:none;background:none;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fst{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--surface-2)}
.fst-h{font-size:12.5px;font-weight:700;margin-bottom:6px}
.fst-h span{font-weight:500;color:var(--ink-3);margin-left:4px}
.fst-l{display:flex;flex-wrap:wrap;gap:6px}
.stn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.stn b{font-variant-numeric:tabular-nums}
.stn:hover{border-color:var(--ink)}
.stn.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);cursor:default}
.mini tr.fc td{color:var(--ink-2)}
.mini tr.avg td{border-top:2px solid var(--line-strong);font-weight:600}
.mini td:first-child{white-space:nowrap}
button.lnk{border:none;background:none;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit;text-align:left}
button.lnk.back{display:inline-block;margin-bottom:10px;font-size:13px}
.ph-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.badge.sm{font-size:12px;padding:1px 8px;border-radius:4px}
.pbars{display:grid;gap:5px}
.pb{display:grid;grid-template-columns:64px 52px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pb-l{color:var(--ink-2);font-weight:600}.pb-v{text-align:right}.pb-p{text-align:right;color:var(--ink-2)}
.pb-t{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.pb-t i{display:block;height:100%;border-right:1px solid rgba(0,0,0,.25)}
.olrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ol{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:var(--surface-2)}
.ol-l{font-size:11.5px;font-weight:600;color:var(--ink-2)}.ol-p{font-size:11.5px;color:var(--ink-3)}
.dtabs.big button{font-size:14px}
.stn .badge.sm{margin-right:2px}
.fdra-bar .details{margin-left:8px;padding:4px 10px;font-size:13px}
.fmsel button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 9px;cursor:pointer;font-size:12.5px}
.fmsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* editor dialog */
dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:16px}
dialog h3{margin:0 0 10px;font-size:16px}
dialog label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
dialog select,dialog textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13.5px;z-index:60;display:none}
.toast.show{display:block}


/* tabs with drop-down */
.ztab .tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.ztab .tl small{font-weight:500;font-size:11.5px;color:var(--ink-3);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ztab[aria-selected="true"] .tl small{color:var(--accent)}
.ztab .chev{font-size:11px;color:var(--ink-3);margin-left:2px}
.ztab[aria-expanded="true"]{background:var(--surface)}
.ztab.ov{padding-top:12px;padding-bottom:12px}
.ztab[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--accent)}
.zmenu{position:absolute;z-index:60;min-width:260px;max-width:min(340px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:none}
.zmenu.show{display:block}
.zmenu .mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.zmenu .mi:hover,.zmenu .mi:focus{background:var(--surface-2)}
.zmenu .mi.cur{background:var(--tab);font-weight:600}
.zmenu .mi small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.zmenu .mi .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.zmenu .msep{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);padding:8px 10px 4px;border-top:1px solid var(--line);margin-top:4px}
/* breadcrumb */
.fdra-bar .crumb{border:none;background:none;padding:2px 4px;cursor:pointer;font-size:14.5px;color:var(--focus);text-decoration:underline;text-underline-offset:2px}
.fdra-bar .crumb.cur{color:var(--ink);font-weight:700;text-decoration:none;cursor:default}
.fdra-bar .sep{color:var(--ink-3)}
.fdra-bar .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
/* panels */
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:14px 16px 16px;box-shadow:var(--shadow)}
.phead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.phead h2{font-size:20px;margin:0}
.phead .pmeta{flex-basis:100%;font-size:13px;color:var(--ink-2)}
.phead .pmeta button.st{border:none;background:none;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13px}
h3.sub{font-size:15px;margin:18px 0 8px}
table.outlook{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:14px;font-variant-numeric:tabular-nums}
table.outlook th,table.outlook td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.outlook thead th{background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
table.outlook thead th span{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
table.outlook tbody th{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1}
table.outlook td.oc{color:var(--cls-ink)}
table.outlook td.oc small{opacity:.75}
table.outlook td.off{border-left:2px solid var(--line-strong)}
table.outlook tr.frow,table.outlook tr.zrow,table.outlook tr.zhead{cursor:pointer}
/* overview: state blocks */
.state-block{margin:18px 0 26px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);background:var(--surface)}
.state-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;color:#fff;
  background:linear-gradient(115deg,#0b1a3d 0%,#14306b 45%,#2a5298 100%)}
.state-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.state-head h3 + span{display:block;margin-top:2px;font-size:12.5px;color:rgba(255,255,255,.85);letter-spacing:.3px}
.state-badge{display:flex;align-items:center;gap:8px}
.state-badge small{font-size:11.5px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.6px}
.state-badge .badge{color:var(--cls-ink);border:1px solid rgba(255,255,255,.6)}
.state-block .tbl-scroll{border:none;border-radius:0}
.state-block table.outlook thead th{background:var(--surface-2);border-bottom:2px solid var(--line-strong)}
.state-block table.outlook{table-layout:fixed}
.state-block table.outlook thead th:first-child{width:24%}
.state-block table.outlook thead th:last-child{width:11%}
.state-block table.outlook tbody th{white-space:normal}
table.outlook tr.frow:hover th,table.outlook tr.zrow:hover th{text-decoration:underline}
table.outlook tr.zhead th{background:var(--surface-2);font-size:14px;padding-top:10px;border-top:2px solid var(--line-strong)}
table.outlook tr.zhead small{font-weight:500;color:var(--focus);margin-left:6px}
table.outlook tr.zhead .sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:8px;vertical-align:-1px}
table.outlook tr.zrow th{font-size:14.5px}
table.outlook tr.zrow td,table.outlook tr.zrow th{border-bottom:2px solid var(--line-strong)}
.muted{color:var(--ink-3)}
:root{--l-obs:#1f4fa8;--l-avg:#6f6b63;--l-max:#c23b3b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--l-obs:#1f4fa8;--l-avg:#55524b;--l-max:#b02f2f}}
.charts{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1150px){.charts{grid-template-columns:1fr 1fr}}
figure.chart{margin:0;min-width:0}
figure.chart figcaption{font-size:14.5px;margin-bottom:4px}
.clegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.clegend i.ln{display:inline-block;width:22px;height:0;border-top:2.5px solid var(--l-obs);vertical-align:middle;margin-right:6px}
.clegend i.fc{border-top-style:dashed}
.clegend i.avg{border-top-color:var(--l-avg);border-top-width:2px}
.clegend i.max{border-top-color:var(--l-max);border-top-width:2px}
.cbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cbox svg{display:block}
.cbox .gl{stroke:rgba(0,0,0,.12);stroke-width:1}
.cbox .gl.v{stroke:rgba(0,0,0,.07)}
.cbox .tk{font-size:11px;fill:#55524b}
.cbox .bl{font-size:11px;fill:#3a3833;font-weight:600}
.cbox .l-obs{fill:none;stroke:var(--l-obs);stroke-width:2.2;stroke-linejoin:round}
.cbox .l-fc{fill:none;stroke:var(--l-obs);stroke-width:2.2;stroke-dasharray:5 4}
.cbox .l-avg{fill:none;stroke:var(--l-avg);stroke-width:1.6}
.cbox .l-max{fill:none;stroke:var(--l-max);stroke-width:1.6}
.cbox .dot-fc{fill:#fff;stroke:var(--l-obs);stroke-width:1.5}
.cbox .dot-now{fill:var(--l-obs);stroke:#fff;stroke-width:2}
.cbox .xh{stroke:#1b1a17;stroke-width:1;stroke-dasharray:3 3}
.ctip{position:absolute;pointer-events:none;background:#1b1a17;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;line-height:1.45}
.ctip .tsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px}
.seg{gap:0!important}
.seg button{border:1px solid var(--line-strong);background:var(--surface);padding:5px 12px;font-size:13px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nodata{border:1px dashed var(--line-strong);border-radius:8px;padding:18px;color:var(--ink-2);background:var(--surface-2);font-size:14px;line-height:1.6}
@media (max-width:700px){ .fdra-bar .chips{margin-left:0;padding-left:0;border-left:none;flex-basis:100%} .phead h2{font-size:18px} }
/* remove the map's blue focus frame (it drew over the station panel) */
.esri-view .esri-view-surface--inset-outline:focus::after,.esri-view .esri-view-surface:focus::after{outline:none!important;content:none!important}
.esri-view .esri-view-surface:focus,.esri-view:focus{outline:none!important}
footer.site-foot{margin-top:36px;background:var(--surface);border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.site-foot .wrap{padding-top:28px;padding-bottom:28px}
.site-foot .partners{display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,64px);flex-wrap:wrap}
.site-foot .partners img{height:64px;width:auto;display:block;filter:saturate(.96)}
.site-foot .foot-line{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center}
.site-foot .foot-name{font-weight:600;color:var(--ink-2)}
@media (max-width:700px){.site-foot .partners img{height:48px}.site-foot .foot-line{justify-content:center;text-align:center}}

@media (max-width:700px){
  .brand h1{font-size:16px}
  .top .right .user-chip{display:none}
  #map{height:52vh}
  .fdra-head h2{font-size:17px}
  .rating-box{margin-left:21px}
  .drawer{right:0;left:0;bottom:0;width:100%;border-radius:14px 14px 0 0;max-height:75vh}
  table.rep th.period{min-width:112px;padding-left:6px}
  table.rep th.period em{display:none}
  .map-tools{flex-direction:row;top:auto;bottom:12px;right:12px;left:auto}
  .map-legend{bottom:auto;top:12px;right:12px}
  .map-tools .btn{padding:5px 8px;font-size:12.5px}
  table.bpt td,table.bpt th{white-space:nowrap;padding:4px 8px}
}
@media (min-width:1900px){ .wrap{max-width:1800px} #map{height:76vh} }
</style>
</head>

<script>
(() => {
const CFG = window.APP_CONFIG;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtNum = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const DEC = {gsi: 2, precip: 2, sc: 1};
// Percentile cell color. FDRAs with their own planner method: ERC and BI percentiles are colored by the
// planner's numbers (expressed as percentiles of the FDRA's history); the other percentiles use the standard ranges.
function pctClass(f, v, key) {
  if (f && f.planner && (key === "erc" || key === "bi") && f.planner[key]) return v[key + "_pcls"] != null ? CLASSES[v[key + "_pcls"]] : null;
  return classForPct(v[key + "_pct"]);
}
const avgTag = P => P && P.window > 1 ? `<br><small class="avgt">${P.window}-day avg</small>` : "";   // averaged methods (second header line)
const PLANNER_COLS = [{key: "ic", label: "IC", group: "Fuels", pct: true}, {key: "sc", label: "SC", group: "Fuels", pct: true}];
const plannerRange = (lim, i) => { if (i < lim.length) return "≤ " + lim[i];
  const step = lim.some(x => x % 1) ? 0.1 : 1, t = lim[lim.length - 1] + step;   // 61.9 -> 62, 62 -> 63
  return "≥ " + +t.toFixed(1); };

let META, CLASSES, BY_ZONE = {}, FDRA = {}, STATIONS = {};
let ratings = {};          // FDRA_ZONE -> {rating, note, oid, edited}
let auth = {token: null, user: null, canEdit: false};
let state = {zone: null, fdra: null};
let mapApi = null;         // filled when the Esri map loads

function classForPct(p) {
  if (p == null) return null;
  return CLASSES.find(c => p >= c.min && p <= c.max) || (p > 100 ? CLASSES[CLASSES.length - 1] : CLASSES[0]);
}
function classByName(n) { return CLASSES.find(c => c.name.toLowerCase() === String(n || "").toLowerCase()); }
function dayLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", {weekday: "short"}) + " - " + d.toLocaleDateString("en-US", {month: "short", day: "numeric"});
}
// Fire Danger for one report row: VPD x SFDI matrix (fd computed in build_web_data.py), else ERC percentile
function fdOf(v) {
  if (!v) return {cls: null, pct: null, method: null};
  if (v.fd != null) return {cls: CLASSES[v.fd], method: v.fd_method, pct: v.fd_method === "matrix" || v.fd_method === "planner" || v.fd_method === "zone" ? null : v[META.fire_danger_index + "_pct"]};
  const p = v[META.fire_danger_index + "_pct"];
  return {cls: classForPct(p), pct: p, method: p != null ? META.fire_danger_index : null};
}
const fdMethodLabel = () => META.fire_danger_method === "matrix" ? "VPD × SFDI" : META.fire_danger_index.toUpperCase() + " %ile";
function calcDanger(f) {   // calculated rating for "Today"
  const R = rowsOf(f), today = R.find(r => r.label === "Today")?.values || R[0]?.values;
  return fdOf(today);
}
function currentDanger(f) { // official if set, else calculated
  const r = ratings[f.key];
  const off = r && classByName(r.rating);
  if (off) return {cls: off, official: true, note: r.note};
  return {...calcDanger(f), official: false};
}
function fmtMst(t) {   // "2026-10-25 00:20:50" -> "Oct 25, 12:20 AM"
  const d = new Date(String(t || "").replace(" ", "T"));
  return isNaN(d) ? String(t || "") : d.toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); }

/* ---------------- data ---------------- */
// Every FDRA in the boundary file is listed, even before its station data exists in GitHub.
async function addFdrasWithoutData() {
  if (!/\.(geo)?json(\?|$)/i.test(CFG.fdraLayerUrl || "")) return;
  if (META.fdra_list_complete) return;          // only the FDRAs in the official FDRA list are shown
  try {
    const gj = await (await fetch(CFG.fdraLayerUrl, {cache: "no-cache"})).json();
    const have = new Set(META.fdras.map(f => f.key));
    const blank = META.fdras[0].report.map(r => ({label: r.label, days: r.days, type: r.type, values: null}));
    const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    (gj.features || []).forEach(ft => {
      const pr = ft.properties || {}, find = n => Object.keys(pr).find(x => x.toLowerCase() === n.toLowerCase());
      const key = String(find("FDRA_ZONE") ? pr[find("FDRA_ZONE")] : [pr[find("Zone")], pr[find("FDRA")]].join(" ")).replace(/\s+/g, " ").trim();
      if (!key || have.has(key)) return;
      have.add(key);
      const [zone, ...rest] = key.split(" ");
      META.fdras.push({key, slug: slug(key), zone, name: rest.join(" ") || key, sig_raws: [], noData: true,
        report: blank, breakpoints: null, fuel_model: "", analysis_period: ""});
    });
  } catch (e) { console.warn("FDRA list from boundaries:", e.message); }
}

async function loadData() {
  const res = await fetch(CFG.dataUrl, {cache: "no-cache"});
  if (!res.ok) throw new Error("data " + res.status);
  META = await res.json();
  CLASSES = META.classes;
  await addFdrasWithoutData();
  META.fdras.forEach(f => { FDRA[f.key] = f; (BY_ZONE[f.zone] ||= []).push(f); });
  Object.values(BY_ZONE).forEach(a => a.sort((a, b) => a.name.localeCompare(b.name)));
  META.stations.forEach(s => STATIONS[s.id] = s);
  const g = new Date(META.generated_utc);
  $("#lastFetched").textContent = "FEMS data last processed: " + g.toLocaleString("en-US", {hour: "numeric", minute: "2-digit", timeZoneName: "short", weekday: "long", month: "long", day: "numeric", year: "numeric"});
  const fullDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric", year: "numeric"}) : "";
  const issued = (() => { const d = new Date(String(META.forecast_pull_mst || "").replace(" ", "T"));
    return isNaN(d) ? esc(META.forecast_pull_mst || "") : d.toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric", year: "numeric"}) + ", " + d.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"}); })();
  $("#sourceLine").innerHTML = `Fuel and weather data is sourced from the <a href="https://fems.fs2c.usda.gov/ui" target="_blank" rel="noopener">Fire Environment Mapping System (FEMS)</a> application.
    Percentile values are based on data from 2005 to 2024. Fire danger is based on breakpoints set locally by the US Forest Service.<br>
    Observed through <strong>${esc(fullDate(META.latest_obs_date))}</strong>; forecast issued <strong>${issued} MST</strong>.`;
}

async function loadRatings() {
  if (!CFG.ratingsTableUrl) return;
  const F = CFG.ratingsFields;
  try {
    const p = new URLSearchParams({where: "1=1", outFields: "*", f: "json"});
    if (auth.token) p.set("token", auth.token);
    const j = await (await fetch(CFG.ratingsTableUrl + "/query?" + p)).json();
    if (j.error) throw new Error(j.error.message);
    ratings = {};
    const oidField = j.objectIdFieldName || "OBJECTID";
    (j.features || []).forEach(ft => {
      const a = ft.attributes;
      if (a[F.key]) ratings[String(a[F.key]).trim()] = {rating: a[F.rating], note: a[F.note], oid: a[oidField], edited: a.EditDate, editor: a.Editor};
    });
  } catch (e) { console.warn("Ratings table not readable:", e.message); }
}

/* ---------------- tabs, zone menu, breadcrumb ---------------- */
function worstOf(list) {
  let worst = null;
  list.forEach(f => { const c = currentDanger(f).cls; if (c && (!worst || CLASSES.indexOf(c) > CLASSES.indexOf(worst))) worst = c; });
  return worst;
}
const zoneDanger = z => { const i = avgClass(BY_ZONE[z].map(f => CLASSES.indexOf(currentDanger(f).cls))); return i == null ? null : CLASSES[i]; };
const zoneLabel = z => CFG.zoneNames[z] || z;
const ZONES = () => Object.keys(BY_ZONE).sort();
// Overview order by state
const STATE_GROUPS = [["Arizona", ["FDZ", "PIFC", "SEZ", "WAZ", "WDZ", "WMZ"]], ["New Mexico", ["ABZ", "GLZ", "PEZ", "SFZ", "TDZ"]]];

function renderTabs() {
  const all = worstOf(META.fdras);
  $("#zoneTabs").innerHTML = `<button class="ztab ov" role="tab" data-overview="1" aria-selected="${!state.zone}">
      <span class="dot" style="background:${all ? all.color : "transparent"}"></span>Southwest Overview</button>` +
    ZONES().map(z => {
      const w = zoneDanger(z), sel = z === state.zone;
      const sub = sel ? (state.fdra ? FDRA[state.fdra].name : "Whole zone") : `${BY_ZONE[z].length} FDRA${BY_ZONE[z].length === 1 ? "" : "s"}`;
      return `<button class="ztab" role="tab" data-zonetab="${esc(z)}" aria-selected="${sel}" aria-haspopup="menu" aria-expanded="false">
        <span class="dot" style="background:${w ? w.color : "transparent"}" title="${w ? "Highest: " + esc(w.name) : ""}"></span>
        <span class="tl"><b>${esc(zoneLabel(z))}</b><small>${esc(sub)}</small></span><span class="chev" aria-hidden="true">▾</span></button>`;
    }).join("");
}

function openZoneMenu(z, btn) {
  const m = $("#zoneMenu");
  if (m.dataset.zone === z && m.classList.contains("show")) return closeZoneMenu();
  const w = zoneDanger(z);
  m.innerHTML = `<button role="menuitem" class="mi whole${state.zone === z && !state.fdra ? " cur" : ""}" data-zone="${esc(z)}">
      <span class="sw" style="background:${w ? w.color : "transparent"}"></span><span><b>Whole ${esc(zoneLabel(z))}</b><small>Zone summary of ${BY_ZONE[z].length} FDRA${BY_ZONE[z].length === 1 ? "" : "s"}</small></span></button>
    <div class="msep">FDRAs in ${esc(zoneLabel(z))}</div>` +
    BY_ZONE[z].map(f => {
      const d = currentDanger(f);
      return `<button role="menuitem" class="mi${state.fdra === f.key ? " cur" : ""}" data-fdra="${esc(f.key)}">
        <span class="sw" style="background:${d.cls ? d.cls.color : "transparent"}"></span><span>${esc(f.name)}<small>${d.cls ? esc(d.cls.name) + (d.official ? " · official" : "") : f.noData ? "No data yet" : "No data"}</small></span></button>`;
    }).join("");
  m.dataset.zone = z; m.classList.add("show"); positionMenu();
  document.querySelectorAll(".ztab[aria-expanded]").forEach(b => b.setAttribute("aria-expanded", b === btn));
  m.querySelector(".mi")?.focus();
}
function positionMenu() {
  const m = $("#zoneMenu"); if (!m.classList.contains("show")) return;
  const btn = document.querySelector(`.ztab[data-zonetab="${CSS.escape(m.dataset.zone)}"]`); if (!btn) return;
  const r = btn.getBoundingClientRect();
  m.style.top = (r.bottom + window.scrollY + 4) + "px";
  m.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.innerWidth - m.offsetWidth - 8)) + "px";

  };
  const md = iso => { const [y, m, d] = iso.split("-"); return +m + "/" + +d + "/" + y; };

  const sub = r => detail ? (r.days.length === 1 ? esc(md(r.days[0])) : r.days.length ? esc(md(r.days[0])) + " →<br>" + esc(md(r.days[r.days.length - 1])) : "")

  const head = first.map(r => `<th>${esc(r.label.replace("Average ", "Avg "))}<span>${sub(r)}</span></th>`).join("");

/* ---------------- season charts (ERC / BI) ---------------- */
let chartRange = "year";
const CHART_CACHE = {};
const CHART_INDICES = [{key: "erc", label: "Energy Release Component (ERC)"}, {key: "bi", label: "Burning Index (BI)"}];
async function loadCharts(f) {
  let d = CHART_CACHE[f.slug];
  if (!d) {

  }

}
function drawCharts(f, d) {
  const host = $("#charts"); if (!host) return;
  host.innerHTML = CHART_INDICES.map(ix => `<figure class="chart" data-ix="${ix.key}">
      <figcaption><b>${esc(ix.label)}</b> <span class="muted">· ${esc(f.name)}</span></figcaption>
      <div class="clegend">
        <span><i class="ln obs"></i>${f.planner && f.planner.window > 1 ? `This season (${f.planner.window}-day average)` : "This season (FDRA average)"}</span><span><i class="ln fc"></i>Forecast</span>
        ${d.climo ? `<span><i class="ln avg"></i>Historical average</span><span><i class="ln max"></i>Historical maximum</span>` : ""}
      </div>
      <div class="cbox"></div></figure>`).join("");

function svgChart(box, f, d, k) {
  const W = Math.max(300, box.clientWidth), H = W < 520 ? 260 : 320;
  const m = {l: 40, r: W < 520 ? 10 : 92, t: 10, b: 28}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const bpIdx = META.breakpoint_indices.indexOf(k);
  let obs = (d.season || []).filter(r => r[k] != null).map(r => ({d: r.d, v: r[k], p: r[k + "_pct"]}));
  let fc = (d.forecast || []).filter(r => r[k] != null).map(r => ({d: r.d, v: r[k], p: r[k + "_pct"]}));
  const W7 = f.planner && f.planner.window > 1 ? f.planner.window : 0;
  if (W7) {   // averaged method: the season line is the N-day average ending on each day (observed, then forecast)
    const lastObs = obs.length ? obs[obs.length - 1].d : "";
    const seq = [...obs, ...fc.filter(r => r.d > lastObs)];
    const avg = seq.map((r, i) => { const w = seq.slice(Math.max(0, i - W7 + 1), i + 1); return {d: r.d, v: +(w.reduce((a, b) => a + b.v, 0) / w.length).toFixed(1), p: null}; });
    obs = avg.filter(r => r.d <= lastObs).slice(W7 - 1);
    fc = avg.filter(r => r.d > lastObs);
  }
  if (!obs.length && !fc.length) { box.innerHTML = `<div class="muted">No data yet.</div>`; return; }
  // x range
  const last = (fc.length ? fc : obs)[(fc.length ? fc : obs).length - 1].d;
  const yr = (obs[0] || fc[0]).d.slice(0, 4);
  const x0 = chartRange === "year" ? new Date(yr + "-01-01T00:00:00") : new Date(new Date(last + "T00:00:00").getTime() - 96 * 864e5);
  const x1 = chartRange === "year" ? new Date(yr + "-12-31T00:00:00") : new Date(last + "T00:00:00");
  const tx = iso => m.l + (new Date(iso + "T00:00:00") - x0) / (x1 - x0) * iw;
  // bands from this FDRA's breakpoints (upper value of each class)
  const lim = f.planner && f.planner[k];   // own method: bands are the planner's numbers
  const bands = lim ? CLASSES.map((c, i) => ({c, hi: lim[Math.min(i, lim.length - 1)], lo: i ? lim[i - 1] : 0}))
    : bpIdx >= 0 && f.breakpoints ? f.breakpoints.map((b, i) => ({c: CLASSES[i], hi: b[k][1], lo: i ? f.breakpoints[i - 1][k][1] : 0})) : [];
  const climo = d.climo ? d.climo.map(c => ({doy: c.doy, avg: c[k + "_avg"], max: c[k + "_max"]})) : [];
  const allV = [...obs, ...fc].map(r => r.v).concat(bands.map(b => b.hi), climo.map(c => c.max || 0));
  const ymax = Math.ceil(Math.max(...allV) * 1.08 / 5) * 5 || 10;
  const ty = v => m.t + ih - v / ymax * ih;
  let g = "";
  // bands
  bands.forEach((b, i) => {
    const top = i === bands.length - 1 ? ymax : Math.min(b.hi, ymax);
    if (b.lo >= ymax) return;
    g += `<rect x="${m.l}" y="${ty(top)}" width="${iw}" height="${ty(b.lo) - ty(top)}" fill="${b.c.color}" opacity=".55"/>`;
    if (m.r > 20) g += `<text class="bl" x="${m.l + iw + 6}" y="${(ty(top) + ty(b.lo)) / 2 + 4}">${esc(b.c.name)}${i < bands.length - 1 ? " ≤" + Math.round(b.hi) : " >" + Math.round(b.lo)}</text>`;
  });
  // grid + y ticks
  const step = ymax > 80 ? 20 : ymax > 40 ? 10 : 5;
  for (let v = 0; v <= ymax; v += step) g += `<line class="gl" x1="${m.l}" x2="${m.l + iw}" y1="${ty(v)}" y2="${ty(v)}"/><text class="tk" x="${m.l - 6}" y="${ty(v) + 4}" text-anchor="end">${v}</text>`;
  // x ticks (months, or weekly in 90-day view)
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  if (chartRange === "year") months.forEach((mn, i) => { const x = tx(`${yr}-${String(i + 1).padStart(2, "0")}-01`); g += `<line class="gl v" x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}"/><text class="tk" x="${x + 3}" y="${H - 8}">${W < 520 ? mn[0] : mn}</text>`; });
  else for (let t = new Date(x0); t <= x1; t = new Date(t.getTime() + (W < 520 ? 28 : 14) * 864e5)) { const iso = t.toISOString().slice(0, 10), x = tx(iso); g += `<line class="gl v" x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}"/><text class="tk" x="${x + 3}" y="${H - 8}">${months[t.getMonth()]} ${t.getDate()}</text>`; }
  const vis = r => { const t = new Date(r.d + "T00:00:00"); return t >= x0 && t <= x1; };
  const path = pts => pts.map((p, i) => `${i ? "L" : "M"}${tx(p.d).toFixed(1)},${ty(p.v).toFixed(1)}`).join("");
  // climatology lines (when the history file exists)
  if (climo.length) {
    const doyIso = doy => new Date(new Date(yr + "-01-01T00:00:00").getTime() + (doy - 1) * 864e5).toISOString().slice(0, 10);
    const cl = key => path(climo.filter(c => c[key] != null).map(c => ({d: doyIso(c.doy), v: c[key]})).filter(vis));
    g += `<path class="l-avg" d="${cl("avg")}"/><path class="l-max" d="${cl("max")}"/>`;
  }
  const o = obs.filter(vis), f2 = fc.filter(vis);
  if (o.length) g += `<path class="l-obs" d="${path(o)}"/>`;
  if (f2.length) g += `<path class="l-fc" d="${path(o.length ? [o[o.length - 1], ...f2] : f2)}"/>` + f2.map(p => `<circle class="dot-fc" cx="${tx(p.d)}" cy="${ty(p.v)}" r="2.5"/>`).join("");
  if (o.length) { const p = o[o.length - 1]; g += `<circle class="dot-now" cx="${tx(p.d)}" cy="${ty(p.v)}" r="4.5"/>`; }
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" style="display:none"/><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(k.toUpperCase())} this season with fire danger bands">${g}</svg><div class="ctip" hidden></div>`;
  // hover tooltip
  const svg = box.querySelector("svg"), xh = svg.querySelector(".xh"), tip = box.querySelector(".ctip");
  const pts = [...o.map(p => ({...p, f: false})), ...f2.map(p => ({...p, f: true}))];
  const move = ev => {
    const r = svg.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = null, bd = 1e9; pts.forEach(p => { const dd = Math.abs(tx(p.d) - cx); if (dd < bd) { bd = dd; best = p; } });
    if (!best || bd > 30) { xh.style.display = "none"; tip.hidden = true; return; }
    const x = tx(best.d), c = classForPct(best.p);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.style.display = "";
    if (f.planner) {   // own method: date, ERC and BI with percentiles, and that day's fire danger from the planner's matrix

    pane.innerHTML = `<div class="fmsel" id="fmSel"><span class="lbl">Fuel model</span>${fms.map(m => `<button data-fm="${m}" aria-pressed="${m === curFm}">${m}</button>`).join("")}</div>
      <table class="mini"><thead><tr><th>Day</th><th>ERC</th><th>BI</th><th>100h</th><th>1000h</th><th>KBDI</th></tr></thead>
      <tbody>${obs.map(r => row(r, false)).join("")}${fc.map(r => row(r, true)).join("")}</tbody></table>
      <div class="footnote">Last 5 observed days followed by forecast days (F). ERC and BI are daily maximums; fuel moistures are daily minimums.</div>`;
  };
  const renderWx = () => {
    const seg = `<div class="fmsel"><span class="lbl">View</span><button data-wx="daily" aria-pressed="${wxMode === "daily"}">Daily</button><button data-wx="hourly" aria-pressed="${wxMode === "hourly"}">Hourly</button></div>`;
    if (wxMode === "daily") {
      const obs = (detail.wx_daily || []).slice(-5), fc = (detail.wx_forecast || []).slice(0, 5);
      const row = (r, f) => `<tr${f ? ' class="fc"' : ""}><td>${esc(dayLabel(r.d))}${f ? " (F)" : ""}</td><td>${fmtNum(r.tmax)}</td><td>${fmtNum(r.tmin)}</td><td>${fmtNum(r.rhmin)}</td><td>${fmtNum(r.wind)}</td><td>${fmtNum(r.gust)}</td><td>${fmtNum(r.precip, 2)}</td><td>${fmtNum(r.vpdmax)}</td></tr>`;
      pane.innerHTML = seg + `<table class="mini"><thead><tr><th>Day</th><th>Max T</th><th>Min T</th><th>Min RH</th><th>Wind</th><th>Gust</th><th>Precip</th><th>VPD</th></tr></thead>
        <tbody>${obs.map(r => row(r, false)).join("")}${fc.map(r => row(r, true)).join("")}</tbody></table>
        <div class="footnote">Last 5 observed days followed by forecast days (F). Temperature °F, RH %, wind and gust mph (daily maximum), precipitation in (24-hour total), VPD Pa (from Max T and Min RH).</div>`;
    } else {
      const hrs = (detail.wx_hourly || []).slice(-24).reverse();
      pane.innerHTML = seg + (hrs.length ? `<table class="mini"><thead><tr><th>Time (LST)</th><th>Temp</th><th>RH</th><th>Wind</th><th>Dir</th><th>Gust</th><th>Precip</th></tr></thead>
        <tbody>${hrs.map(r => `<tr><td>${esc(fmtMst(r.h))}</td><td>${fmtNum(r.t)}</td><td>${fmtNum(r.rh)}</td><td>${fmtNum(r.ws)}</td><td>${compass(r.wd)}</td><td>${fmtNum(r.gs)}</td><td>${fmtNum(r.p, 2)}</td></tr>`).join("")}</tbody></table>
        <div class="footnote">Last 24 hourly observations, newest first. Temperature °F, RH %, wind and gust mph, precipitation in.</div>` : `<div class="muted">No recent hourly observations.</div>`);
    }
  };
  const render = () => {
    document.querySelectorAll("#dBody [data-dtab]").forEach(b => b.setAttribute("aria-selected", b.dataset.dtab === drawerTab));
    drawerTab === "fd" ? renderFd() : renderWx();
  };
  render();
  $("#dBody").onclick = e => {
    if (e.target.closest("[data-back]")) { e.stopPropagation(); return openPanelForState(); }
    const t = e.target.closest("[data-dtab],[data-fm],[data-wx]"); if (!t) return;
    if (t.dataset.dtab) drawerTab = t.dataset.dtab;
    if (t.dataset.fm) curFm = t.dataset.fm;
    if (t.dataset.wx) wxMode = t.dataset.wx;
    render();
  };
}

let editingKey = null;
function openEditor(key) {
  const f = FDRA[key], calc = calcDanger(f), r = ratings[key];
  editingKey = key;
  $("#editTitle").textContent = f.name + " FDRA (" + f.zone + ")";
  $("#editCalc").textContent = "Calculated today: " + (calc.cls ? `${calc.cls.name} (${calc.method === "planner" ? f.planner.label : calc.method === "matrix" ? "VPD × SFDI" : META.fire_danger_index.toUpperCase() + " " + calc.pct + "%"})` : "no data");
  $("#editRating").innerHTML = `<option value="">— Use calculated rating —</option>` + CLASSES.map(c => `<option${r && classByName(r.rating) === c ? " selected" : ""}>${esc(c.name)}</option>`).join("");
  $("#editNote").value = r?.note || "";
  $("#editDlg").showModal();
}
$("#editForm").addEventListener("submit", async e => {
  if (e.submitter?.value !== "save") return;
  e.preventDefault();
  const F = CFG.ratingsFields, key = editingKey, r = ratings[key];
  const attrs = {[F.key]: key, [F.rating]: $("#editRating").value || null, [F.note]: $("#editNote").value.trim() || null};
  const body = new URLSearchParams({f: "json", token: auth.token});
  if (r?.oid != null) body.set("updates", JSON.stringify([{attributes: {OBJECTID: r.oid, ...attrs}}]));
  else body.set("adds", JSON.stringify([{attributes: attrs}]));
  $("#editSave").disabled = true;
  try {
    const j = await (await fetch(CFG.ratingsTableUrl + "/applyEdits", {method: "POST", body})).json();
    const res = (j.updateResults || j.addResults || [])[0];
    if (j.error || !res?.success) throw new Error(j.error?.message || res?.error?.description || "Save was rejected");
    await loadRatings();
    $("#editDlg").close();
    renderAll(); mapApi?.refresh();
    toast("Rating saved for " + key);
  } catch (err) { toast("Unable to save: " + err.message); }
  finally { $("#editSave").disabled = false; }
});

/* ---------------- sign in (ArcGIS OAuth, NIFC org) ---------------- */
function setupAuth(esriId, OAuthInfo, Portal) {
  if (!CFG.oauthClientId || !CFG.ratingsTableUrl) return;
  const info = new OAuthInfo({appId: CFG.oauthClientId, portalUrl: CFG.portalUrl, popup: false, flowType: "authorization-code"});
  esriId.registerOAuthInfos([info]);
  const sharing = info.portalUrl + "/sharing";
  const onSignedIn = async cred => {
    auth.token = cred.token;
    const portal = new Portal({url: CFG.portalUrl, authMode: "immediate"});
    await portal.load();
    auth.user = portal.user;
    let ok = true;
    if (CFG.editorsGroupId) {
      const groups = await portal.user.fetchGroups();
      ok = groups.some(g => g.id === CFG.editorsGroupId);
    }
    auth.canEdit = ok;
    $("#userChip").textContent = (portal.user.fullName || portal.user.username) + (ok ? " · editor" : " · view only");
    $("#signInBtn").hidden = true; $("#signOutBtn").hidden = false;
    await loadRatings(); renderAll(); mapApi?.refresh();
    if (!ok) toast("You are signed in with view-only access.");
  };
  $("#signInBtn").hidden = false;
  $("#signInBtn").onclick = () => esriId.getCredential(sharing).then(onSignedIn).catch(() => {});
  $("#signOutBtn").onclick = () => { esriId.destroyCredentials(); location.reload(); };
  esriId.checkSignInStatus(sharing).then(onSignedIn).catch(() => {});
}

/* ---------------- map (ArcGIS Maps SDK) ---------------- */
function startMap() {
  if (!window.require) {
    if (document.readyState !== "complete") { window.addEventListener("load", startMap, {once: true}); return; }
    $("#mapMsg").classList.add("show"); return;
  }
  window.require([
    "esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/layers/GraphicsLayer", "esri/Graphic",
    "esri/geometry/Extent", "esri/identity/IdentityManager", "esri/identity/OAuthInfo", "esri/portal/Portal",
    "esri/layers/GeoJSONLayer"
  ], (Map, MapView, FeatureLayer, GraphicsLayer, Graphic, Extent, esriId, OAuthInfo, Portal, GeoJSONLayer) => {
    setupAuth(esriId, OAuthInfo, Portal);
    const map = new Map({basemap: "topo-vector"});
    const view = new MapView({container: "map", map, center: [-108.6, 34.3], zoom: 6, constraints: {minZoom: 3, snapToZoom: false},
      popup: {dockEnabled: false}, ui: {components: ["zoom", "attribution"]}});
    const focus = CFG.focusStates.map(n => `'${n.replace(/'/g, "''")}'`).join(",");
    const geoEl = document.getElementById("statesGeo");
    if (geoEl) {
      const statesUrl = URL.createObjectURL(new Blob([geoEl.textContent], {type: "application/json"}));
      map.add(new GeoJSONLayer({url: statesUrl, definitionExpression: `name NOT IN (${focus})`, popupEnabled: false,
        renderer: {type: "simple", symbol: {type: "simple-fill", color: [250, 249, 246, 0.55], outline: {color: [120, 116, 108, 0.6], width: 0.6}}}}));
      map.add(new GeoJSONLayer({url: statesUrl, definitionExpression: `name IN (${focus})`, popupEnabled: false,
        renderer: {type: "simple", symbol: {type: "simple-fill", color: [0, 0, 0, 0], outline: {color: [40, 38, 34, 1], width: 2.4}}}}));
    }
    let keyFields = CFG.fdraKeyFields === "auto" ? null : [].concat(CFG.fdraKeyFields || "FDRA_ZONE");
    let fdraSource = null, fdraShapes = null;   // fdraShapes: [{key, geometry}] loaded once
    const fdraPolys = new GraphicsLayer();       // colored polygons (color = official or calculated rating)
    if (CFG.fdraLayerUrl) {
      fdraSource = /\.(geo)?json(\?|$)/i.test(CFG.fdraLayerUrl)
        ? new GeoJSONLayer({url: CFG.fdraLayerUrl}) : new FeatureLayer({url: CFG.fdraLayerUrl});
      map.add(fdraPolys);
    }
    // zone boundaries: thick navy outline + zone name, drawn above the FDRAs; the selected zone in orange, on top
    // (one color for all zones because neighboring zones share their borders)
    const ZONE_LINE = "#1e3a8a", ZONE_SEL = "#ea580c";
    const zoneLayer = new GraphicsLayer();
    let zoneShapes = null;
    if (CFG.zonesUrl) map.add(zoneLayer);
    async function loadZoneShapes() {
      if (zoneShapes || !CFG.zonesUrl) return zoneShapes;
      try {
        const src = new GeoJSONLayer({url: CFG.zonesUrl});
        const res = await src.queryFeatures({where: "1=1", outFields: ["*"], returnGeometry: true, outSpatialReference: view.spatialReference});
        zoneShapes = res.features.map(ft => ({zone: ft.attributes.ZONE, geometry: ft.geometry, lon: ft.attributes.lab_lon, lat: ft.attributes.lab_lat}));
      } catch (e) { console.warn("Zone boundaries:", e.message); zoneShapes = []; }
      return zoneShapes;
    }
    async function drawZones() {
      const zs = await loadZoneShapes();
      if (!zs) return;
      zoneLayer.removeAll();
      const cur = state.zone, gs = [];
      [...zs].sort((a, b) => (a.zone === cur) - (b.zone === cur)).forEach(z => {
        const sel = z.zone === cur, rgb = hex2rgb(sel ? ZONE_SEL : ZONE_LINE);
        const alpha = !cur || sel ? 1 : 0.55, width = !cur ? 3 : sel ? (state.fdra ? 3.5 : 4.5) : 2;
        gs.push(new Graphic({geometry: z.geometry, attributes: {zone: z.zone},
          symbol: {type: "simple-fill", color: [0, 0, 0, 0], outline: {color: [...rgb, alpha], width, join: "round", cap: "round"}}}));
        if (z.lon != null) gs.push(new Graphic({geometry: {type: "point", longitude: z.lon, latitude: z.lat}, attributes: {zone: z.zone},
          symbol: {type: "text", text: z.zone, color: [...rgb, !cur || sel ? 1 : 0.6], haloColor: [255, 255, 255, 0.95], haloSize: 2,
            font: {size: sel ? 15 : 12, weight: "bold", family: "sans-serif"}}}));
      });
      zoneLayer.addMany(gs);
    }
    const stLayer = new GraphicsLayer();
    map.add(stLayer);
    let selSt = null;

    const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    function drawStations() {
      stLayer.removeAll();
      const zoneSt = new Set((state.zone ? BY_ZONE[state.zone] : META.fdras).flatMap(f => f.sig_raws));
      const fdraSt = new Set(FDRA[state.fdra]?.sig_raws || []);
      const gs = META.stations.map(s => {
        const inZone = zoneSt.has(s.id), inF = fdraSt.has(s.id), sel = s.id === selSt;
        const k = stationClass(s), m = s.map || {};
        const ring = sel ? "sel" : inF ? "fdra" : "";
        return new Graphic({
          geometry: {type: "point", longitude: s.lon, latitude: s.lat},
          attributes: {id: s.id},
          symbol: {type: "picture-marker", url: stationIcon(s.fdras.length ? "circle" : "diamond", k, m.trend, ring),
            width: sel ? 26 : 22, height: sel ? 26 : 22},
          popupTemplate: null
        });
      });
      // draw selected-zone stations last so they sit on top
      gs.sort((a, b) => (zoneSt.has(a.attributes.id) - zoneSt.has(b.attributes.id)) || (fdraSt.has(a.attributes.id) - fdraSt.has(b.attributes.id)));
      stLayer.addMany(gs);
    }
    async function loadFdraShapes() {
      if (!fdraSource || fdraShapes) return fdraShapes;
      try {
        const res = await fdraSource.queryFeatures({where: "1=1", outFields: ["*"], returnGeometry: true, outSpatialReference: view.spatialReference});
        if (!keyFields) {      // auto-detect the name field(s)
          const names = Object.keys(res.features[0]?.attributes || {});
          const find = n => names.find(x => x.toLowerCase() === n.toLowerCase());
          keyFields = find("FDRA_ZONE") ? [find("FDRA_ZONE")] : (find("Zone") && find("FDRA")) ? [find("Zone"), find("FDRA")] : [find("FDRA") || names[0]];
        }
        fdraShapes = res.features.map(ft => ({key: keyFields.map(k => String(ft.attributes[k] ?? "").trim()).join(" ").replace(/\s+/g, " ").trim(), geometry: ft.geometry}));
        const missing = META.fdras.filter(f => !fdraShapes.some(x => x.key === f.key)).map(f => f.key);
        if (missing.length) console.warn("FDRA boundaries not matched for:", missing.join(", "));
      } catch (e) { console.warn("FDRA layer:", e.message); fdraShapes = []; }
      return fdraShapes;
    }
    async function drawFdraPolys() {
      const shapes = await loadFdraShapes();
      if (!shapes) return;
      fdraPolys.removeAll();
      const mode = state.fdra ? "fdra" : state.zone ? "zone" : "all";
      const items = shapes.filter(x => FDRA[x.key] || !META.fdra_list_complete).map(x => {
        const f = FDRA[x.key];
        if (!f || f.noData) return {rank: f && (mode === "zone" ? f.zone === state.zone : x.key === state.fdra) ? 2.5 : -1,
          g: new Graphic({geometry: x.geometry, attributes: {key: f ? x.key : null},   // FDRA with no station data yet
          symbol: (() => {
            const hi = f && (mode === "zone" ? f.zone === state.zone : mode === "fdra" ? x.key === state.fdra : false);
            const near = f && mode === "fdra" && f.zone === state.zone && !hi;
            return {type: "simple-fill", color: hi ? [150, 146, 138, 0.35] : near ? [150, 146, 138, 0.15] : [0, 0, 0, 0],
              outline: {color: hi ? [20, 20, 20, 1] : [110, 106, 98, mode === "all" || near ? 0.6 : 0.3], width: hi ? (mode === "fdra" ? 3.5 : 2.2) : near ? 1 : 0.6, style: "short-dash"}};
          })()})};
        const c = currentDanger(f).cls, rgb = c ? hex2rgb(c.color) : [200, 196, 188];
        const inZone = f.zone === state.zone, sel = x.key === state.fdra;
        // overview: every FDRA colored + framed; zone: zone FDRAs strong, others faded; FDRA: selected strongest
        let fill, line, width, rank;
        if (mode === "all")       { fill = 0.62; line = [45, 42, 38, 0.9]; width = 1.2; rank = 1; }
        else if (mode === "zone") { fill = inZone ? 0.75 : 0.12; line = inZone ? [20, 20, 20, 1] : [90, 86, 80, 0.35]; width = inZone ? 2.2 : 0.6; rank = inZone ? 2 : 0; }
        else                      { fill = sel ? 0.85 : inZone ? 0.4 : 0.1; line = sel ? [10, 10, 10, 1] : inZone ? [40, 38, 34, 0.7] : [90, 86, 80, 0.3]; width = sel ? 3.5 : inZone ? 1.2 : 0.5; rank = sel ? 3 : inZone ? 1 : 0; }
        return {rank, g: new Graphic({geometry: x.geometry, attributes: {key: x.key},
          symbol: {type: "simple-fill", color: [...rgb, fill], outline: {color: line, width}}})};
      });
      items.sort((a, b) => a.rank - b.rank);           // highlighted FDRAs drawn on top so their frame is not covered
      fdraPolys.addMany(items.map(i => i.g));
    }
    // Fit extents in the map's own (Web Mercator) units so the whole area shows, with nothing cut at the top or bottom.
    function fitExtent(ex) {
      const sr = ex.spatialReference;
      if (!(sr && (sr.wkid === 4326 || sr.isGeographic))) return ex;
      const R = 6378137, d = Math.PI / 180, clampLat = v => Math.max(-85, Math.min(85, v));
      const y = lat => R * Math.log(Math.tan(Math.PI / 4 + clampLat(lat) * d / 2));
      return new Extent({xmin: ex.xmin * d * R, xmax: ex.xmax * d * R, ymin: y(ex.ymin), ymax: y(ex.ymax), spatialReference: {wkid: 3857}});
    }
    function extentOf(ids) {
      const pts = ids.map(id => STATIONS[id]).filter(Boolean);
      if (!pts.length) return null;
      const xs = pts.map(p => p.lon), ys = pts.map(p => p.lat), pad = 0.35;
      return new Extent({xmin: Math.min(...xs) - pad, ymin: Math.min(...ys) - pad, xmax: Math.max(...xs) + pad, ymax: Math.max(...ys) + pad, spatialReference: {wkid: 4326}});
    }
    async function zoomKeys(keys) {
      const shapes = (await loadFdraShapes() || []).filter(x => keys.includes(x.key));
      // On desktop the details popup opens on the right for a zone/FDRA: keep the selection clear of it.
      setPadding(innerWidth >= 900 && !drawerMin ? Math.min(470, innerWidth - 32) + 24 : 0);
      if (shapes.length) {
        let ex = shapes[0].geometry.extent.clone();
        shapes.slice(1).forEach(x => ex = ex.union(x.geometry.extent));
        return view.goTo(fitExtent(ex).expand(1.12)).catch(() => {});
      }
      const ex = extentOf(keys.flatMap(k => FDRA[k].sig_raws));
      if (ex) view.goTo(fitExtent(ex).expand(1.4)).catch(() => {});
    }

    view.on("click", async evt => {
      const hit = await view.hitTest(evt);
      const st = hit.results.find(r => r.graphic?.layer === stLayer);
      if (st) { openStation(st.graphic.attributes.id); return; }
      const poly = hit.results.find(r => r.graphic?.layer === fdraPolys);
      if (poly && poly.graphic.attributes.key) { selectFdra(poly.graphic.attributes.key); return; }   // zooms to the FDRA
      const zn = hit.results.find(r => r.graphic?.layer === zoneLayer && r.graphic.attributes?.zone);
      if (zn && BY_ZONE[zn.graphic.attributes.zone]) selectZone(zn.graphic.attributes.zone);       // clicked inside a zone, outside its FDRAs
    });
    view.on("pointer-move", async evt => {
      const hit = await view.hitTest(evt, {include: [stLayer, fdraPolys]});
      view.container.style.cursor = hit.results.length ? "pointer" : "default";
    });

    mapApi = {
      refresh() { drawStations(); drawFdraPolys(); drawZones(); },
      zoomToView() {
        if (state.fdra) return zoomKeys([state.fdra]);
        if (state.zone) return zoomKeys(BY_ZONE[state.zone].map(f => f.key));
        this.zoomRegion();
      },
      zoomRegion() { setPadding(openDrawerPad()); view.goTo(fitExtent(new Extent({xmin: -115.05, ymin: 31.05, xmax: -102.75, ymax: 37.62, spatialReference: {wkid: 4326}}))).catch(() => {}); },
      zoomUS() { setPadding(openDrawerPad()); view.goTo(fitExtent(new Extent({xmin: -125, ymin: 24.5, xmax: -66.5, ymax: 49.5, spatialReference: {wkid: 4326}}))).catch(() => {}); },
      highlightStation(id) { selSt = id; drawStations(); }
    };
    // Keep the zones clear of the zoom buttons on the right (desktop); the map content sits a little to the left.
    let padExtra = 0;
    // Width to keep clear on the right while the details popup is open (desktop only).
    const openDrawerPad = () => innerWidth >= 900 && !drawerMin && $("#drawer").classList.contains("show") ? Math.min(470, innerWidth - 32) + 24 : 0;
    function setPadding(extra) {
      if (extra !== undefined) padExtra = extra;
      const tools = document.querySelector(".map-tools");
      const right = innerWidth > 700 && tools ? Math.max(tools.offsetWidth + 24, padExtra) : 0;
      view.padding = {top: 0, left: 0, bottom: 0, right};
    }
    setPadding(); addEventListener("resize", () => setPadding());
    view.when(() => { mapApi.refresh(); mapApi.zoomToView(); }, () => $("#mapMsg").classList.add("show"));
  }, () => $("#mapMsg").classList.add("show"));
}

/* ---------------- start ---------------- */
(async () => {
  try { await loadData(); }
  catch (e) { $("#lastFetched").textContent = "Data is temporarily unavailable. Please try again shortly."; return; }
  await loadRatings();
  const [hz, hf] = decodeURIComponent(location.hash.slice(1)).split("/");
  state.zone = BY_ZONE[hz] ? hz : null;            // default: no zone selected (overview)
