name: FEMS Obs Daily MinMax (NM+AZ)

on:
  workflow_dispatch:        # optional manual run
  repository_dispatch:
    types: [obs-daily]

permissions:
  contents: write

concurrency:
  group: fems-data
  cancel-in-progress: false

jobs:
  obs-daily:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-dateutil arcgis

      - name: Download existing history from release
        run: |
          gh release download obs-history -p history_daily_weatherminmax.csv -D data || echo "history_daily_weatherminmax.csv not in release yet (first run)"
          gh release download obs-history -p history_daily_nfdrminmax.csv -D data || echo "history_daily_nfdrminmax.csv not in release yet (first run)"
          gh release download obs-history -p history_hourly_weather.csv -D data || echo "history_hourly_weather.csv not available yet — Max/Min VPD will be blank this run"

      - name: Run obs daily minmax pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
        run: python scripts/obs_daily_minmax.py

      - name: Upload history to release
        run: |
          gh release upload obs-history data/history_daily_weatherminmax.csv data/history_daily_nfdrminmax.csv --clobber

      - name: Build observed daily FDRA NFDR and refresh ArcGIS
        env:
          AGOL_CLIENT_ID: ${{ secrets.AGOL_CLIENT_ID }}
          AGOL_REFRESH_TOKEN: ${{ secrets.AGOL_REFRESH_TOKEN }}
          ARCGIS_PORTAL_URL: https://nifc.maps.arcgis.com
          ARCGIS_FDRA_ITEM_ID: 66e86d16806046c098a0e2860cb520bc
        run: python scripts/obs_nfdr_daily_fdra.py

      - name: Upload daily FDRA output
        run: |
          gh release upload obs-history data/obs_nfdr_daily_fdra.csv --clobber
