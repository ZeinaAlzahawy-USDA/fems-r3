name: FEMS Obs Hourly (NM+AZ)

on:
  workflow_dispatch:        # optional manual run
  repository_dispatch:
    types: [obs-hourly]

permissions:
  contents: read

concurrency:
  group: fems-data
  cancel-in-progress: false

jobs:
  obs-hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil arcgis==2.4.3

      - name: Run obs hourly pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
          AGOL_CLIENT_ID: ${{ secrets.AGOL_CLIENT_ID }}
          AGOL_REFRESH_TOKEN: ${{ secrets.AGOL_REFRESH_TOKEN }}
        run: python scripts/obs_hourly_direct.py
