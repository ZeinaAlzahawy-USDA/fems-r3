name: FEMS Obs Hourly (NM+AZ)

on:
  workflow_dispatch:        # optional manual run
  repository_dispatch:
    types: [obs-hourly]

permissions:
  contents: write

concurrency:
  group: fems-data
  cancel-in-progress: false

jobs:
  obs-hourly:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil

      - name: Download existing history from release
        run: |
          gh release download obs-history -p history_hourly_weather.csv -D data || echo "history_hourly_weather.csv not in release yet (first run)"
          gh release download obs-history -p history_hourly_nfdr.csv -D data || echo "history_hourly_nfdr.csv not in release yet (first run)"

      - name: Run obs hourly pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
        run: python scripts/obs_hourly.py

      - name: Upload history to release
        run: |
          gh release upload obs-history data/history_hourly_weather.csv data/history_hourly_nfdr.csv --clobber
