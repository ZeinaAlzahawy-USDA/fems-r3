name: FEMS Obs Hourly (NM+AZ)

on:
  workflow_dispatch:        # optional manual run
  repository_dispatch:
    types: [obs-hourly]

permissions:
  contents: write

concurrency:
  group: fems-data
  cancel-in-progress: false

jobs:
  obs-hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil

      - name: Run obs hourly pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
        run: python scripts/obs_hourly.py

      - name: Commit history files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/history_hourly_weather.csv data/history_hourly_nfdr.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Obs hourly data (NM+AZ)"
            git pull --rebase
            git push
          fi
