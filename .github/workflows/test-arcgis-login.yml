name: Test ArcGIS Login

on:
  push:

permissions:
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ArcGIS Python API
        run: python -m pip install arcgis==2.4.3

      - name: Test ArcGIS login
        env:
          AGOL_USERNAME: ${{ secrets.AGOL_USERNAME }}
          AGOL_PASSWORD: ${{ secrets.AGOL_PASSWORD }}
        run: python "scripts/test_arcgis_login.py"