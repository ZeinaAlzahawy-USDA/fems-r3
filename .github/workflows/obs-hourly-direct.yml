name: FEMS Obs Hourly Direct (NM+AZ)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [obs-hourly]

permissions:
  contents: read

concurrency:
  group: fems-data
  cancel-in-progress: false

jobs:
  obs-hourly-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil arcgis==2.4.3

      - name: Run hourly direct-connect pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
          AGOL_CLIENT_ID: ${{ secrets.AGOL_CLIENT_ID }}
          AGOL_CLIENT_SECRET: ${{ secrets.AGOL_CLIENT_SECRET }}
        run: python scripts/obs_hourly_direct.py
