name: FEMS Hourly Pull (NM+AZ)

on:
  schedule:
    - cron: "17 * * * *" 
  workflow_dispatch:       # optional manual run
  repository_dispatch:
    types: [hourly-pull]

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl python-dateutil

      - name: Run FEMS pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
        run: python scripts/fems_pull.py

      - name: Commit history files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/*.xlsx data/*.csv || true
          git commit -m "FEMS hourly data (NM+AZ)" || true
          git push || true

      - name: Upload latest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fems-latest
          path: |
            data/fems_latest_weatherObs.xlsx
            data/fems_latest_nfdrsObs.xlsx
            data/fems_latest_wxMinMax.xlsx
            data/fems_latest_nfdrMinMax.xlsx
