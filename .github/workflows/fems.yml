name: FEMS Hourly Pull (NM+AZ)

on:
  workflow_dispatch:  # start it once manually

permissions:
  contents: write

concurrency:
  group: fems-hourly
  cancel-in-progress: true

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ~1 min run + 60 min sleep + a little buffer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl python-dateutil

      - name: Run FEMS pull
        env:
          FEMS_USERNAME: ${{ secrets.FEMS_USERNAME }}
          FEMS_API_KEY: ${{ secrets.FEMS_API_KEY }}
        run: python scripts/fems_pull.py

      - name: Commit history files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/*.xlsx data/*.csv || true
          git commit -m "FEMS hourly data (NM+AZ)" || true
          git push || true

      - name: Upload latest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fems-latest
          path: |
            data/fems_latest_weatherObs.xlsx
            data/fems_latest_nfdrsObs.xlsx
            data/fems_latest_wxMinMax.xlsx
            data/fems_latest_nfdrMinMax.xlsx

      # Sleep FIRST, then trigger the next run
      - name: Wait exactly 1 hour
        run: sleep 3600

      - name: Trigger next run (exact hourly)
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ACTIONS_TRIGGER_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/fems.yml/dispatches \
            -d '{"ref":"main"}'
